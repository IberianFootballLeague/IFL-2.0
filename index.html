<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
  <meta name="description" content="Iberian Football League, la liga de fútbol de Roblox.">
  <title>Iberian Football League</title>
  <link rel="stylesheet" href="css/styles.css?v=8">
</head>
<body>
  <!-- Navegación inicial de IFL 2.0; las secciones se añadirán progresivamente. -->
  <header class="site-header">
    <nav class="main-nav" aria-label="Navegación principal">
      <a class="brand" href="/" aria-label="Iberian Football League, inicio">
        <img class="brand-logo" src="logo" alt="Logo de Iberian Football League" width="120" height="72">
      </a>

      <details class="mobile-menu">
        <summary aria-label="Abrir menú de navegación">
          <span class="menu-icon" aria-hidden="true"><span></span><span></span><span></span></span>
          <span>Menú</span>
        </summary>
        <div class="mobile-menu-panel">
          <a class="nav-link is-active" href="/" aria-current="page">Inicio</a>
          <a class="nav-link" href="#calendario">Calendario</a>
          <a class="nav-link" href="#clasificacion">Clasificación</a>
          <a class="nav-link" href="#estadios">Estadios</a>
          <a class="nav-link" href="#buscar">Buscar</a>
          <a class="nav-link" href="#mercado">Mercado</a>
        </div>
      </details>

      <div class="desktop-menu">
        <a class="nav-link is-active" href="/" aria-current="page">Inicio</a>
        <a class="nav-link" href="#calendario">Calendario</a>
        <a class="nav-link" href="#clasificacion">Clasificación</a>
        <a class="nav-link" href="#estadios">Estadios</a>
        <a class="nav-link" href="#buscar">Buscar</a>
        <a class="nav-link" href="#mercado">Mercado</a>

        <details class="profile-menu">
          <summary class="profile-trigger" aria-label="Abrir menú de perfil">
            <span class="profile-avatar" aria-hidden="true"></span>
          </summary>
          <div class="profile-panel" aria-label="Opciones de perfil">
            <button class="profile-option profile-login-option" type="button">Iniciar sesión con Discord</button>
            <button class="profile-option" type="button" disabled>Mi perfil</button>
            <button class="profile-option" type="button" disabled>Mi club</button>
            <button class="profile-option" type="button" disabled>Ajustes</button>
            <button class="profile-option" type="button" disabled>Cerrar sesión</button>
            <div class="profile-divider" role="separator"></div>
            <button class="profile-option profile-option-admin" type="button" disabled>Admin Panel</button>
          </div>
        </details>
      </div>

      <details class="profile-menu mobile-profile-menu">
        <summary class="profile-trigger" aria-label="Abrir menú de perfil">
          <span class="profile-avatar" aria-hidden="true"></span>
        </summary>
        <div class="profile-panel" aria-label="Opciones de perfil">
          <button class="profile-option profile-login-option" type="button">Iniciar sesión con Discord</button>
          <button class="profile-option" type="button" disabled>Mi perfil</button>
          <button class="profile-option" type="button" disabled>Mi club</button>
          <button class="profile-option" type="button" disabled>Ajustes</button>
          <button class="profile-option" type="button" disabled>Cerrar sesión</button>
          <div class="profile-divider" role="separator"></div>
          <button class="profile-option profile-option-admin" type="button" disabled>Admin Panel</button>
        </div>
      </details>
    </nav>
  </header>

  <main id="contenido"></main>

  <script src="https://unpkg.com/@supabase/supabase-js@2.117.3"></script>
  <script>
    (() => {
      const SUPABASE_URL = "https://boazhychmpxeuplyxzsi.supabase.co";
      const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_C_iRhldD-coePRVqcNDCGA_oGIA1u3d";
      const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
        auth: { autoRefreshToken: true, persistSession: true, storageKey: "ifl-auth-2" }
      });

      const loginOptions = [...document.querySelectorAll(".profile-login-option")];
      const logoutOptions = [...document.querySelectorAll(".profile-option")].filter((option) => option.textContent.trim() === "Cerrar sesión");

      function setAuthState(session) {
        const user = session?.user || null;
        document.body.dataset.authenticated = user ? "true" : "false";
        loginOptions.forEach((option) => {
          option.textContent = user
            ? (user.user_metadata?.full_name || user.user_metadata?.name || "Sesión iniciada")
            : "Iniciar sesión con Discord";
          option.disabled = Boolean(user);
        });
        logoutOptions.forEach((option) => {
          option.disabled = !user;
          option.dataset.authAction = user ? "logout" : "";
        });
        document.querySelectorAll(".profile-trigger").forEach((trigger) => {
          trigger.title = user
            ? "Sesión iniciada como " + (user.user_metadata?.full_name || user.user_metadata?.name || "usuario de Discord")
            : "Iniciar sesión con Discord";
        });
      }

      async function signIn() {
        loginOptions.forEach((option) => { option.disabled = true; option.textContent = "Conectando…"; });
        const { error } = await supabaseClient.auth.signInWithOAuth({
          provider: "discord",
          options: { redirectTo: window.location.origin + window.location.pathname }
        });
        if (error) {
          console.error("[IFL 2.0] No se pudo iniciar sesión con Discord:", error);
          setAuthState(null);
          alert("No se pudo iniciar sesión con Discord. Comprueba la configuración de OAuth.");
        }
      }

      async function signOut() {
        const { error } = await supabaseClient.auth.signOut();
        if (error) console.error("[IFL 2.0] No se pudo cerrar sesión:", error);
      }

      loginOptions.forEach((option) => option.addEventListener("click", signIn));
      logoutOptions.forEach((option) => option.addEventListener("click", signOut));
      supabaseClient.auth.onAuthStateChange((_event, session) => setAuthState(session));
      supabaseClient.auth.getSession().then(({ data }) => setAuthState(data.session));
    })();
  </script>
</body>
</html>
